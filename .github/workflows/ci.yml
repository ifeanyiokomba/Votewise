name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: TypeScript check
        run: bunx tsc --noEmit
        continue-on-error: true # Temporarily allow TS errors during cleanup

      - name: ESLint
        run: bun run lint

      - name: Run tests
        run: bunx vitest run

      - name: Validate Prisma schema
        run: bunx prisma validate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Audit dependencies
        run: bun audit || true # Report but don't fail
